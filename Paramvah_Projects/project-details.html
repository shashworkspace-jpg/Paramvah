<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project | Paramvah Construction</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#171714;font:14px Arial,sans-serif}.wrap{width:min(1080px,90%);margin:auto}.top{background:#171714;padding:17px 0}.top a{color:#f0cf70;text-decoration:none}.hero{padding:40px 0 24px}.eyebrow{color:#92700e;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:bold}.badge{display:inline-block;background:#f4e7c7;color:#755819;padding:7px 10px;text-transform:uppercase;font-size:10px;font-weight:bold;letter-spacing:.1em}.h1{font:600 clamp(36px,6vw,62px)/1.08 Georgia,serif;margin:14px 0}.intro{max-width:720px;color:#666;line-height:1.8}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.gallery img{width:100%;height:330px;object-fit:cover;background:#ddd}.details{display:grid;grid-template-columns:1.3fr .7fr;gap:40px;padding:38px 0 70px}.details h2{font:600 30px Georgia,serif}.details p,.details li{color:#666;line-height:1.8}.aside{background:white;border:1px solid #e8e3d7;padding:22px;height:max-content}.aside p{white-space:pre-line}.btn{display:inline-block;background:#d9ad32;color:#171714;text-decoration:none;padding:13px 17px;font-size:12px;font-weight:bold}@media(max-width:650px){.details{grid-template-columns:1fr}.gallery img{height:auto;max-height:380px}}</style></head><body><header class="top"><div class="wrap"><a href="../Paramvah_Construction_Website.html#projects">← Back to projects</a></div></header><main class="wrap" id="app"></main><script>
const KEY='paramvahProjectsV1';const defaults=[{id:'shashwath-residence',title:'Shashwath Residence',status:'ongoing',summary:'A contemporary multi-level residence with warm brick finishes, generous balconies and a welcoming street presence.',description:'The residence is defined by layered rooflines, a shaded upper balcony and a welcoming entrance framed by textured brickwork.',location:'',stage:'Ongoing',features:['Multi-level residential home','Brick and light-render exterior palette'],photos:['Paramvah_Projects/assets/shashwath-residence-front.png','Paramvah_Projects/assets/shashwath-residence-angle.png']}];
function resolvePhoto(src){return /^(data:|https?:)/.test(src)?src:(src.startsWith('Paramvah_Projects/')?'../'+src:src)}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}let data=defaults;try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved))data=saved}catch(e){}const id=new URLSearchParams(location.search).get('slug');const p=data.find(x=>x.id===id);const app=document.getElementById('app');if(!p){app.innerHTML='<section class="hero"><h1 class="h1">Project not found</h1><p class="intro">This project may have been removed. Return to the projects page to browse current work.</p></section>'}else{const imgs=(p.photos||[]).map(src=>`<img src="${esc(resolvePhoto(src))}" alt="${esc(p.title)} project photo">`).join('');const features=(p.features||[]).map(x=>`<li>${esc(x)}</li>`).join('');app.innerHTML=`<section class="hero"><span class="badge">${esc(p.status)}</span><div class="eyebrow">Paramvah project</div><h1 class="h1">${esc(p.title)}</h1><p class="intro">${esc(p.summary)}</p></section><section class="gallery">${imgs}</section><section class="details"><div><h2>Project overview</h2><p>${esc(p.description)}</p><h2>Key details</h2><ul>${features||'<li>Project details will be added soon.</li>'}</ul></div><aside class="aside"><b>Project information</b><p>Location: ${esc(p.location||'To be added')}\nStage: ${esc(p.stage||p.status)}\nStatus: ${esc(p.status)}</p><a class="btn" href="../Paramvah_Construction_Website.html#contact">Discuss your project ↗</a></aside></section>`}
</script></body></html>
